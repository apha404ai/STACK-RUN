<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#22142f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Stack Run: a tiny, fast falling-block arcade game. Play in your browser. Can you beat my score?">
  <meta property="og:type" content="website">
  <meta property="og:title" content="STACK RUN — one more round?">
  <meta property="og:description" content="A tiny falling-block challenge. Tap to play and share your score.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="STACK RUN — one more round?">
  <meta name="twitter:description" content="A tiny falling-block challenge. Can you beat my score?">
  <title>STACK RUN — Mini Arcade</title>
  <style>
    :root { color-scheme: dark; --bg:#21142e; --panel:#2e1b3d; --stroke:#604661; --cream:#f7e5c2; --gold:#f9c85a; --orange:#f58e53; --muted:#bba0c0; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { height:100%; background:var(--bg); }
    body { margin:0; min-height:100%; font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; color:var(--cream); background: radial-gradient(ellipse at 50% 0%,#452759 0%,#291937 48%,#1a1227 100%); overscroll-behavior-y:contain; }
    button { font:inherit; -webkit-appearance:none; appearance:none; cursor:pointer; color:inherit; }
    button:focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
    .shell { margin:0 auto; max-width:480px; min-height:100dvh; padding: max(10px, env(safe-area-inset-top)) 14px max(9px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:9px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; min-height:39px; gap:10px; }
    .brand { display:flex; align-items:center; gap:9px; }
    .brand-icon { color:#231629; background:var(--gold); border:2px solid #ffe5a2; font-size:15px; line-height:1; font-weight:1000; border-radius:8px; padding:7px; box-shadow:3px 3px 0 #120d1b; }
    .brand strong { letter-spacing:1.8px; font-size:clamp(16px,4.7vw,23px); color:var(--gold); font-weight:1000; line-height:1; }
    .brand small { display:block; margin-top:4px; font-size:9px; color:var(--muted); letter-spacing:2px; }
    .top-right { display:flex; align-items:center; gap:7px; }
    .icon-btn { min-height:37px; min-width:37px; border:1px solid var(--stroke); border-radius:10px; background:var(--panel); display:grid; place-items:center; font-size:17px; }
    .sound-off { opacity:.55; }
    .stats { display:grid; grid-template-columns: 1.4fr 1fr 1fr; gap:7px; }
    .stat { background:rgba(30,17,41,.72); border:2px solid var(--stroke); border-radius:11px; padding:8px 9px; min-height:58px; box-shadow:0 3px 0 rgba(0,0,0,.13); }
    .stat:first-child { border-color:var(--gold); }
    .stat-label { font-size:9px; letter-spacing:1.4px; color:var(--muted); margin-bottom:5px; }
    .stat-value { font-size:clamp(17px,5.1vw,25px); font-weight:900; line-height:1; color:var(--cream); font-variant-numeric:tabular-nums; white-space:nowrap; }
    .stat:first-child .stat-value { color:var(--gold); }
    .playfield { flex:1; min-height:0; display:flex; justify-content:center; align-items:center; gap:10px; padding:2px 0; }
    .board-box { width:clamp(145px,min(57vw,30dvh,257px),257px); flex:none; position:relative; aspect-ratio:1/2; overflow:hidden; border:4px solid #edba6d; border-radius:12px; background:#180f24; box-shadow:0 7px 0 #100b1a, 0 18px 30px #100b1a77; touch-action:none; }
    #board { display:block; width:100%; height:100%; image-rendering:pixelated; }
    .side { width:clamp(86px,25vw,113px); align-self:stretch; display:flex; flex-direction:column; gap:9px; max-height: min(60dvh, 514px); }
    .sidecard { position:relative; width:100%; border:2px solid var(--stroke); background:#271831; border-radius:11px; padding:10px 6px 6px; text-align:center; }
    .sidecard-label { color:var(--muted); font-size:10px; letter-spacing:1.7px; margin-bottom:3px; font-weight:800; }
    .sidecard canvas { display:block; margin:auto; width:75px; max-width:100%; height:66px; image-rendering:pixelated; }
    #hold-btn { touch-action:manipulation; }
    #hold-btn:active { border-color:var(--gold); transform:translateY(1px); }
    .side-hint { color:#8d7298; font-size:9px; letter-spacing:1px; margin-top:1px; }
    .mini-stat { padding:10px 5px; }
    .mini-stat .stat-value { margin-top:5px; font-size:19px; color:var(--gold); }
    .side-bottom { margin-top:auto; color:var(--muted); text-align:center; font-size:10px; line-height:1.8; }
    .side-bottom b { color:var(--gold); }
    .controls { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:7px; margin-top:3px; user-select:none; -webkit-user-select:none; }
    .ctrl { border:2px solid #76566a; border-bottom:5px solid #4c344d; border-radius:14px; background:#553d55; min-height:clamp(58px,9dvh,75px); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:3px; touch-action:none; }
    .ctrl:active, .ctrl.pressed { background:#79516b; border-bottom-width:2px; transform:translateY(3px); }
    .ctrl .symbol { font:900 clamp(21px,7vw,30px)/1 system-ui,sans-serif; }
    .ctrl .small { font-size:9px; letter-spacing:1px; color:#e2cddd; }
    .ctrl.primary { background:var(--orange); border-color:#ffe1ba; border-bottom-color:#ad5837; color:#231525; }
    .ctrl.primary .small { color:#3f2130; font-weight:900; }
    .ctrl.primary:active { background:#ffab71; }
    .footer { display:flex; align-items:center; justify-content:space-between; padding:0 3px; gap:6px; color:var(--muted); font-size:10px; line-height:1.5; }
    .footer a { color:var(--gold); text-decoration:none; font-weight:bold; }
    .footer button { color:var(--gold); border:0; background:none; padding:3px 0; text-decoration:underline; font-size:10px; }
    .overlay { position:absolute; z-index:5; inset:0; background:rgba(33,20,46,.93); display:flex; align-items:center; justify-content:center; text-align:center; padding:14px; }
    .overlay.hidden { display:none; }
    .overlay-inner { width:100%; }
    .overline { color:var(--muted); letter-spacing:2px; font-size:10px; }
    .hero { font-weight:1000; color:var(--gold); font-size:clamp(24px,7.2vw,38px); letter-spacing:1px; line-height:.98; margin:16px 0 12px; text-shadow:4px 4px 0 #a95745; }
    .overlay p { color:var(--cream); font-size:12px; line-height:1.8; margin:0 0 18px; }
    .overlay .sub { color:var(--muted); font-size:10px; margin:9px 0 0; }
    .big-button { background:var(--orange); border:3px solid #fff0d6; color:#261526; padding:13px 16px; border-radius:12px; min-width:145px; box-shadow:0 5px 0 #6e3b44; font-weight:1000; font-size:17px; letter-spacing:1.5px; }
    .big-button:active { transform:translateY(4px); box-shadow:0 1px 0 #6e3b44; }
    #gameover-actions { display:none; flex-direction:column; gap:9px; align-items:center; margin-top:4px; }
    #share-btn { padding:10px 13px; background:transparent; border:2px solid var(--cream); border-radius:10px; font-size:12px; letter-spacing:1px; font-weight:900; width:145px; }
    .toast { position:fixed; z-index:20; left:50%; top:12%; transform:translateX(-50%); background:var(--gold); color:#27142d; border-radius:10px; font-weight:900; font-size:13px; padding:9px 16px; opacity:0; transition:opacity .18s; pointer-events:none; white-space:nowrap; }
    .toast.visible { opacity:1; }
    @media (max-height: 665px) {
      .shell { gap:5px; padding-top:6px; padding-bottom:5px; }
      .board-box { width:clamp(134px,min(54vw,27dvh,235px),235px); }
      .stat { min-height:49px; padding:6px 8px; }
      .sidecard { padding-top:5px; padding-bottom:4px; }
      .sidecard canvas { height:54px; }
      .side-bottom { display:none; }
      .ctrl { min-height:52px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*:before,*:after { animation-duration:.01ms!important; transition:none!important; } }
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="brand-icon">▦</span><div><strong>STACK RUN</strong><small>MINI BLOCK ARCADE</small></div></div>
    <div class="top-right"><button class="icon-btn" id="sound" aria-label="Toggle sound" title="Sound">♪</button><button class="icon-btn" id="pause" aria-label="Pause or resume game" title="Pause">Ⅱ</button></div>
  </header>
  <section class="stats" aria-label="Game statistics">
    <div class="stat"><div class="stat-label">SCORE</div><div id="score" class="stat-value">0</div></div>
    <div class="stat"><div class="stat-label">BEST</div><div id="best" class="stat-value">0</div></div>
    <div class="stat"><div class="stat-label">LINES</div><div id="lines" class="stat-value">0</div></div>
  </section>
  <main class="playfield">
    <div class="board-box" id="board-touch" aria-label="Game board. Tap to rotate, swipe sideways to move, swipe down to drop.">
      <canvas id="board" width="300" height="600"></canvas>
      <div class="overlay" id="overlay" aria-live="polite">
        <div class="overlay-inner">
          <div class="overline" id="overlay-overline">WELCOME TO THE ARCADE</div>
          <div class="hero" id="overlay-title">STACK<br>RUN</div>
          <p id="overlay-desc">Stack blocks. Clear lines.<br>Chase your high score.</p>
          <button class="big-button" id="play">▶ PLAY</button>
          <div id="gameover-actions"><button id="share-btn">SHARE ON X ↗</button></div>
          <div class="sub" id="overlay-sub">TAP • SWIPE • BEAT YOUR BEST</div>
        </div>
      </div>
    </div>
    <aside class="side">
      <button class="sidecard" id="hold-btn" aria-label="Hold current block"><div class="sidecard-label">HOLD</div><canvas id="hold-canvas" width="80" height="70"></canvas><div class="side-hint">TAP TO SAVE</div></button>
      <div class="sidecard"><div class="sidecard-label">NEXT</div><canvas id="next-canvas" width="80" height="70"></canvas></div>
      <div class="sidecard mini-stat"><div class="sidecard-label">LEVEL</div><div id="level" class="stat-value">1</div></div>
      <div class="side-bottom">ONE MORE<br><b>ROUND?</b></div>
    </aside>
  </main>
  <nav class="controls" aria-label="Game controls">
    <button class="ctrl" id="left" aria-label="Move left"><span class="symbol">←</span><span class="small">LEFT</span></button>
    <button class="ctrl" id="rotate" aria-label="Rotate"><span class="symbol">↻</span><span class="small">TURN</span></button>
    <button class="ctrl" id="down" aria-label="Move down faster"><span class="symbol">↓</span><span class="small">SOFT</span></button>
    <button class="ctrl" id="right" aria-label="Move right"><span class="symbol">→</span><span class="small">RIGHT</span></button>
    <button class="ctrl primary" id="drop" aria-label="Drop block instantly"><span class="symbol">⇣</span><span class="small">DROP</span></button>
  </nav>
  <footer class="footer"><span>NO DOWNLOAD · NO LOGIN</span><button id="help" type="button">HOW TO PLAY</button></footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
 'use strict';
 const C = 10, R = 20, SIZE = 30;
 const canvas = document.getElementById('board'), ctx = canvas.getContext('2d', { alpha: false });
 const nextCtx = document.getElementById('next-canvas').getContext('2d');
 const holdCtx = document.getElementById('hold-canvas').getContext('2d');
 const $ = (id) => document.getElementById(id);
 const SHAPES = {
   I: [[1,1,1,1]], O:[[1,1],[1,1]], T:[[0,1,0],[1,1,1]],
   S:[[0,1,1],[1,1,0]], Z:[[1,1,0],[0,1,1]],
   J:[[1,0,0],[1,1,1]], L:[[0,0,1],[1,1,1]]
 };
 const COLORS = {I:'#70caba',O:'#f9ca61',T:'#aa8dea',S:'#9bcf81',Z:'#f0768e',J:'#79a9ec',L:'#fa9a60'};
 let board, piece, bag=[], nextType, held=null, usedHold=false;
 let score=0, best=0, lines=0, level=1, status='ready', lastTime=0, fallTime=0, softHeld=false;
 let animationFrame=0, soundOn=false, audio=null, toastTimer=0, flash=0;
 try { best=Number(localStorage.getItem('stack-run-best-v1')) || 0; } catch (_) {}
 $('best').textContent=best.toLocaleString('en-US');

 function beep(freq=440, duration=.07, type='square') {
   if(!soundOn)return;
   try {
     if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)();
     if(audio.state==='suspended') audio.resume();
     const oscillator=audio.createOscillator(), gain=audio.createGain();
     oscillator.type=type; oscillator.frequency.value=freq;
     gain.gain.setValueAtTime(.025,audio.currentTime);
     gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
     oscillator.connect(gain); gain.connect(audio.destination);
     oscillator.start(); oscillator.stop(audio.currentTime+duration);
   } catch (_) {}
 }
 function toast(s) { const e=$('toast');e.textContent=s;e.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('visible'),900); }
 function fetchType() {
   if(!bag.length){ bag=Object.keys(SHAPES);for(let i=bag.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];} }
   return bag.pop();
 }
 function makePiece(type) { let matrix=SHAPES[type].map(row=>row.slice());return { type,matrix,x:Math.floor((C-matrix[0].length)/2),y:0 }; }
 function collides(p=piece, dx=0, dy=0, matrix=p.matrix) {
   for(let y=0;y<matrix.length;y++) for(let x=0;x<matrix[y].length;x++) {
     if(!matrix[y][x])continue;
     const nx=p.x+x+dx, ny=p.y+y+dy;
     if(nx<0||nx>=C||ny>=R||(ny>=0&&board[ny][nx]))return true;
   }
   return false;
 }
 function newPiece(resetHold=true) {
   piece=makePiece(nextType);nextType=fetchType();
   if(resetHold)usedHold=false;
   renderMini(nextCtx,nextType);renderMini(holdCtx,held);
   if(collides()) gameOver();
 }
 function resetGame(){
   board=Array.from({length:R},()=>Array(C).fill(null));bag=[];nextType=fetchType();held=null;usedHold=false;
   score=0;lines=0;level=1;fallTime=0;flash=0;softHeld=false;
   status='playing';lastTime=performance.now();
   newPiece();updateStats();hideOverlay();$('pause').textContent='Ⅱ';beep(540,.12);
   if(!animationFrame) animationFrame=requestAnimationFrame(tick);
 }
 function updateStats(){
   $('score').textContent=score.toLocaleString('en-US');$('best').textContent=best.toLocaleString('en-US');
   $('lines').textContent=lines;$('level').textContent=level;
 }
 function saveBest(){ if(score>best){best=score;try{localStorage.setItem('stack-run-best-v1',String(best));}catch(_){} } }
 function move(dx){if(status!=='playing'||!piece)return false;if(!collides(piece,dx,0)){piece.x+=dx;beep(300,.018);return true;}return false;}
 function rotate(){
   if(status!=='playing'||!piece)return;
   const a=piece.matrix,rot=a[0].map((_,i)=>a.map(r=>r[i]).reverse());
   for(const dx of [0,-1,1,-2,2]){
     if(!collides(piece,dx,0,rot)){piece.matrix=rot;piece.x+=dx;beep(440,.04);return;}
   }
 }
 function softDrop(manual=false){
   if(status!=='playing'||!piece)return;
   if(!collides(piece,0,1)){piece.y++;if(manual){score++;saveBest();updateStats();}}
   else lockPiece();
 }
 function hardDrop(){
   if(status!=='playing'||!piece)return;
   let n=0;while(!collides(piece,0,1)){piece.y++;n++;}
   score+=2*n;beep(180,.1);lockPiece();
 }
 function lockPiece(){
   if(status!=='playing'||!piece)return;
   let topOut=false;
   for(let y=0;y<piece.matrix.length;y++)for(let x=0;x<piece.matrix[y].length;x++)if(piece.matrix[y][x]){
     const cy=piece.y+y,cx=piece.x+x;
     if(cy<0)topOut=true;else if(cy<R&&cx>=0&&cx<C)board[cy][cx]=piece.type;
   }
   if(topOut){gameOver();return;}
   let cleared=0;
   for(let row=R-1;row>=0;){
     if(board[row].every(Boolean)) {board.splice(row,1);board.unshift(Array(C).fill(null));cleared++;}
     else row--;
   }
   if(cleared){
     const points=[0,100,300,500,800];const awarded=points[cleared]*level;score+=awarded;
     lines+=cleared;level=Math.floor(lines/10)+1;flash=160;
     beep(cleared===4?840:620,.16,'sine');
     toast(cleared===4?'QUAD CLEAR! +'+awarded:cleared+' LINE'+(cleared>1?'S':'')+' CLEARED!');
   }
   saveBest();updateStats();newPiece();
 }
 function hold(){
   if(status!=='playing'||usedHold||!piece)return;
   const current=piece.type;
   if(held===null){held=current;newPiece(false);}
   else {piece=makePiece(held);held=current;if(collides())gameOver();}
   usedHold=true;renderMini(holdCtx,held);beep(380,.075);
 }
 function showOverlay(kind){
   $('overlay').classList.remove('hidden');$('gameover-actions').style.display=kind==='over'?'flex':'none';
   if(kind==='pause'){
     $('overlay-overline').textContent='BREAK TIME';$('overlay-title').innerHTML='PAUSED';
     $('overlay-desc').innerHTML='The blocks are waiting.<br>Ready when you are.';
     $('play').textContent='▶ RESUME';$('overlay-sub').textContent='TAP TO CONTINUE';
   } else if(kind==='over') {
     $('overlay-overline').textContent='GAME OVER';$('overlay-title').innerHTML='NICE<br>RUN!';
     $('overlay-desc').innerHTML='SCORE <b style="color:#f9ca61">'+score.toLocaleString('en-US')+'</b><br>BEST '+best.toLocaleString('en-US');
     $('play').textContent='↻ RUN AGAIN';$('overlay-sub').textContent='POST YOUR SCORE · CHALLENGE A FRIEND';
   } else {
     $('overlay-overline').textContent='WELCOME TO THE ARCADE';$('overlay-title').innerHTML='STACK<br>RUN';
     $('overlay-desc').innerHTML='Stack blocks. Clear lines.<br>Chase your high score.';
     $('play').textContent='▶ PLAY';$('overlay-sub').textContent='TAP • SWIPE • BEAT YOUR BEST';
   }
 }
 function hideOverlay(){$('overlay').classList.add('hidden');}
 function gameOver(){status='over';saveBest();updateStats();showOverlay('over');$('pause').textContent='Ⅱ';beep(150,.25,'sawtooth');}
 function togglePause(){
   if(status==='playing'){status='paused';softHeld=false;showOverlay('pause');$('pause').textContent='▶';}
   else if(status==='paused'){status='playing';lastTime=performance.now();hideOverlay();$('pause').textContent='Ⅱ';if(!animationFrame)animationFrame=requestAnimationFrame(tick);}
 }
 function playAction(){if(status==='paused')togglePause();else resetGame();}
 function fillBlock(c,x,y,s,ghost=false){
   if(ghost){c.strokeStyle='#9c7f9b';c.lineWidth=2;c.strokeRect(x+3,y+3,s-6,s-6);return;}
   c.fillStyle=COLORS[c._type]||'#fff';
   c.fillRect(x+1,y+1,s-2,s-2);
   c.fillStyle='rgba(255,255,255,.24)';c.fillRect(x+3,y+3,s-6,3);c.fillRect(x+3,y+3,3,s-6);
   c.fillStyle='rgba(0,0,0,.23)';c.fillRect(x+3,y+s-6,s-6,3);c.fillRect(x+s-6,y+3,3,s-6);
 }
 function renderMini(c,type){
   c.clearRect(0,0,80,70); if(!type)return;
   const m=SHAPES[type],unit=Math.min(17,65/m[0].length,56/m.length),ox=(80-m[0].length*unit)/2,oy=(70-m.length*unit)/2;
   c._type=type;
   for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x])fillBlock(c,ox+x*unit,oy+y*unit,unit);
 }
 function draw(){
   ctx.fillStyle='#1b1129';ctx.fillRect(0,0,300,600);
   ctx.strokeStyle='#392542';ctx.lineWidth=1;
   for(let x=1;x<C;x++){ctx.beginPath();ctx.moveTo(x*SIZE+.5,0);ctx.lineTo(x*SIZE+.5,600);ctx.stroke();}
   for(let y=1;y<R;y++){ctx.beginPath();ctx.moveTo(0,y*SIZE+.5);ctx.lineTo(300,y*SIZE+.5);ctx.stroke();}
   if(!board)return;
   for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(board[y][x]){ctx._type=board[y][x];fillBlock(ctx,x*SIZE,y*SIZE,SIZE);}
   if(piece){
     if(status==='playing'||status==='paused'){
       let dy=0;while(!collides(piece,0,dy+1))dy++;
       for(let y=0;y<piece.matrix.length;y++)for(let x=0;x<piece.matrix[y].length;x++)if(piece.matrix[y][x]&&y+piece.y+dy>=0){fillBlock(ctx,(piece.x+x)*SIZE,(piece.y+y+dy)*SIZE,SIZE,true);}
     }
     ctx._type=piece.type;
     for(let y=0;y<piece.matrix.length;y++)for(let x=0;x<piece.matrix[y].length;x++)if(piece.matrix[y][x]&&y+piece.y>=0){fillBlock(ctx,(piece.x+x)*SIZE,(piece.y+y)*SIZE,SIZE);}
   }
   if(flash>0){ctx.fillStyle='rgba(249,200,90,'+(flash/700)+')';ctx.fillRect(0,0,300,600);}
 }
 function tick(now){
   animationFrame=0;
   const dt=Math.min(now-lastTime,100);lastTime=now;
   if(status==='playing'){
     fallTime+=dt;
     const speed=softHeld?45:Math.max(95,840*Math.pow(.79,level-1));
     if(fallTime>=speed){fallTime=0;softDrop(softHeld);}
     if(flash>0)flash=Math.max(0,flash-dt);
   }
   draw();
   if(status==='playing')animationFrame=requestAnimationFrame(tick);
 }
 function share(){
   const url=/^https?:/.test(location.protocol)?location.href.split('#')[0]:'';
   const text='I scored '+score.toLocaleString('en-US')+' in STACK RUN 🟨🟪 Can you beat me?';
   const link='https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+(url?'&url='+encodeURIComponent(url):'');
   window.open(link,'_blank','noopener,noreferrer');
 }
 $('play').addEventListener('click',playAction);
 $('pause').addEventListener('click',()=>{if(status==='ready'||status==='over')return;togglePause();});
 $('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').classList.toggle('sound-off',!soundOn);$('sound').textContent=soundOn?'♪':'♩';beep(620,.08);});
 $('sound').classList.add('sound-off');
 $('share-btn').addEventListener('click',share);
 $('hold-btn').addEventListener('click',hold);
 $('help').addEventListener('click',()=>{if(status==='playing')togglePause();toast('TAP TURN · SWIPE MOVE · DOWN DROP');});
 $('rotate').addEventListener('click',rotate);
 $('drop').addEventListener('click',hardDrop);
 for(const [id,fn] of [['left',()=>move(-1)],['right',()=>move(1)],['down',()=>softDrop(true)]]) {
   const btn=$(id);let delay=null, repeat=null;
   const stop=()=>{clearTimeout(delay);clearInterval(repeat);delay=null;repeat=null;btn.classList.remove('pressed');if(id==='down')softHeld=false;};
   btn.addEventListener('pointerdown',e=>{
     if(e.button!==0)return;
     e.preventDefault();stop();btn.classList.add('pressed');fn();
     if(id==='down')softHeld=true;
     try {btn.setPointerCapture(e.pointerId);}catch(_){}
     delay=setTimeout(()=>repeat=setInterval(fn,id==='down'?48:80),id==='down'?160:190);
   });
   ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>btn.addEventListener(ev,stop));
 }
 // Taps rotate; sideways swipes move a piece; quick downward swipe drops it.
 let touchStart=null;
 $('board-touch').addEventListener('pointerdown',e=>{
   if(status!=='playing')return;
   touchStart={x:e.clientX,y:e.clientY,at:performance.now(),pointerId:e.pointerId};
   try{$('board-touch').setPointerCapture(e.pointerId);}catch(_){}
 });
 $('board-touch').addEventListener('pointerup',e=>{
   if(!touchStart||e.pointerId!==touchStart.pointerId)return;
   const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;touchStart=null;
   if(status!=='playing')return;
   if(Math.abs(dx)<17&&Math.abs(dy)<17){rotate();return;}
   if(dy>55&&Math.abs(dy)>Math.abs(dx)*1.2) {hardDrop();return;}
   if(dy< -55&&Math.abs(dy)>Math.abs(dx)) {rotate();return;}
   if(Math.abs(dx)>20){const steps=Math.min(6,Math.max(1,Math.round(Math.abs(dx)/35)));for(let i=0;i<steps;i++)move(Math.sign(dx));}
 });
 $('board-touch').addEventListener('pointercancel',()=>touchStart=null);
 const keys={ArrowLeft:()=>move(-1),ArrowRight:()=>move(1),ArrowDown:()=>softDrop(true),ArrowUp:rotate,' ':hardDrop,x:rotate,X:rotate,c:hold,C:hold,Shift:hold};
 document.addEventListener('keydown',e=>{
   if(e.key in keys||['p','P','Escape','Enter'].includes(e.key))e.preventDefault();
   if(e.key==='Escape'||e.key==='p'||e.key==='P'){togglePause();return;}
   if(e.key==='Enter'&&(status==='ready'||status==='over'||status==='paused')){playAction();return;}
   if(e.repeat&&[' ','ArrowUp','c','C','Shift'].includes(e.key))return;
   if(keys[e.key])keys[e.key]();
 });
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&status==='playing')togglePause();});
 window.addEventListener('pagehide',()=>{if(status==='playing')togglePause();});
 renderMini(holdCtx,null);renderMini(nextCtx,null);
 // Preview background blocks before the user starts.
 board=Array.from({length:R},()=>Array(C).fill(null));
 const demo=[['L',9,9],['O',8,11],['S',5,13],['T',2,15],['I',6,17],['J',0,18],['Z',4,19]];
 for(const [t,x,y] of demo){for(let py=0;py<SHAPES[t].length;py++)for(let px=0;px<SHAPES[t][py].length;px++)if(SHAPES[t][py][px]&&y+py<R&&x+px<C)board[y+py][x+px]=t;}
 draw();showOverlay('ready');
})();
</script>
</body>
</html>
